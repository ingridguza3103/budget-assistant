name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: budget_assistant_ci
      DB_USER: budget_app
      DB_PASSWORD: ci-only-password
      APP_ORIGIN: http://127.0.0.1:5173
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: budget_assistant_ci
          POSTGRES_USER: budget_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U budget_app -d budget_assistant_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test React
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test:coverage

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run database migrations
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Test FastAPI with coverage
        env:
          PYTHONPATH: backend
        run: |
          python -m coverage run -m unittest discover -s backend/tests -v
          python -m coverage xml -o backend/coverage.xml
          python -m coverage json -o backend/coverage.json
          python -m coverage html -d backend/htmlcov

      - name: Enforce 80% application coverage
        run: python scripts/check_coverage.py

      - name: Upload coverage reports
        if: always() && hashFiles('backend/coverage.xml', 'frontend/coverage/lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            backend/coverage.json
            backend/htmlcov/
            frontend/coverage/
          if-no-files-found: error
          retention-days: 7

      - name: Analyze with SonarQube Cloud
        if: github.ref == 'refs/heads/main' && vars.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Upload the frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: budget-assistant-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
